group = 'com.amazon.corretto.gradle.plugins'
version = '1.0.0-SNAPSHOT'

apply plugin: 'groovy'
apply plugin: 'java-gradle-plugin'

repositories{
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'org.apache.commons:commons-compress:1.13'
    implementation 'commons-io:commons-io:2.5'
}

gradlePlugin {
    plugins {
        customTar {
            id = 'com.amazon.corretto.gradle.plugin.customtar' 
            implementationClass = 'com.amazon.corretto.gradle.plugin.customtar.CustomTarPlugin'
        }
    }
}

artifacts {
    archives jar
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

